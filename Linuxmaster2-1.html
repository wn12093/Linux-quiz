<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리눅스마스터 2급 1차 - 전체 문제 퀴즈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:#f5f5f0;color:#222;min-height:100vh}
#app{max-width:780px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:0.25rem}
.subtitle{text-align:center;font-size:13px;color:#666;margin-bottom:1.5rem}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border:0.5px solid #ddd;border-radius:10px;padding:0.75rem;text-align:center}
.stat-val{font-size:22px;font-weight:600}
.stat-label{font-size:11px;color:#888;margin-top:2px}
.prog-wrap{margin-bottom:1.25rem}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:5px}
.prog-bg{background:#e8e8e0;border-radius:99px;height:7px}
.prog-fill{background:#1D9E75;border-radius:99px;height:7px;transition:width .4s}
.filter-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.filter-btn{font-size:12px;padding:4px 10px;border:0.5px solid #ccc;border-radius:99px;background:#fff;cursor:pointer;color:#555}
.filter-btn.active{background:#1D9E75;border-color:#1D9E75;color:#fff;font-weight:500}
.q-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.q-tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;margin-bottom:0.6rem;background:#e8f5ee;color:#0f6e56}
.q-num{font-size:12px;color:#aaa;margin-bottom:0.4rem}
.q-text{font-size:15px;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.opt{text-align:left;background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:0.7rem 1rem;font-size:14px;cursor:pointer;line-height:1.5;transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:#f0f0e8;border-color:#aaa}
.opt.correct{background:#e8f5ee;border-color:#1D9E75;color:#0f6e56;font-weight:500}
.opt.wrong{background:#fdf0f0;border-color:#e24b4a;color:#a32d2d}
.opt:disabled{cursor:default}
.explain{background:#f8f8f4;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:0.75rem 1rem;font-size:13px;color:#444;line-height:1.65;margin-bottom:1rem;display:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#fff;border:0.5px solid #bbb;border-radius:8px;padding:0.55rem 1.1rem;font-size:14px;font-weight:500;color:#333;cursor:pointer;transition:background .12s}
.btn:hover{background:#f0f0e8}
.btn:active{transform:scale(0.98)}
.btn.primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn.primary:hover{background:#0f6e56}
.result-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:2.5rem;text-align:center}
.result-ring{width:120px;height:120px;border-radius:50%;background:#e8f5ee;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;flex-direction:column}
.result-pct{font-size:34px;font-weight:700;color:#0f6e56}
.result-sub{font-size:12px;color:#888}
.result-comment{font-size:15px;color:#222;line-height:1.65;margin-bottom:1.5rem;padding:1rem;background:#f8f8f4;border-radius:8px}
.wrong-list{text-align:left;margin-bottom:1.5rem}
.wrong-list h3{font-size:14px;font-weight:600;margin-bottom:0.75rem;color:#555}
.wrong-item{font-size:13px;color:#555;padding:0.4rem 0;border-bottom:0.5px solid #eee;line-height:1.5}
.start-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:2rem;margin-bottom:1rem}
.start-card h2{font-size:16px;font-weight:600;margin-bottom:0.75rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1rem}
.mode-btn{background:#f8f8f4;border:0.5px solid #ccc;border-radius:10px;padding:1rem;text-align:center;cursor:pointer;transition:background .12s}
.mode-btn:hover{background:#e8f5ee;border-color:#1D9E75}
.mode-title{font-size:15px;font-weight:600;margin-bottom:0.25rem}
.mode-desc{font-size:12px;color:#666}
</style>
</head>
<body>
<div id="app">
  <h1>🐧 리눅스마스터 2급 1차</h1>
  <p class="subtitle">기출문제 기반 · 전체 문제</p>
  <div id="main"></div>
</div>
<script>
const ALL_Q=[
{tag:"디렉터리",q:"/opt 디렉터리에 대한 설명으로 올바른 것은?",opts:["각 장치에 필요한 socket 및 log 파일이 저장된다","응용 소프트웨어 패키지가 설치되는 디렉터리다","커널과 프로세스를 위한 가상 파일 시스템 디렉터리다","시스템 관리에 필요한 설정 파일이 저장된다"],ans:1,ex:"/opt는 Add-On 응용소프트웨어 패키지 설치 디렉터리입니다. 로그 파일은 /var/log, 설정 파일은 /etc, 가상 파일시스템은 /proc입니다."},
{tag:"디렉터리",q:"사용자 계정 생성 시 홈 디렉터리에 기본 제공할 파일을 두는 디렉터리는?",opts:["/etc/default/useradd","/etc/skel","/etc/login.defs","/var/spool"],ans:1,ex:"/etc/skel에 있는 파일들이 계정 생성 시 사용자 홈 디렉터리로 자동 복사됩니다."},
{tag:"명령어",q:"콘솔 모드에서 로그아웃 방법으로 틀린 것은?",opts:["logout","exit","Ctrl+C","Ctrl+D"],ans:2,ex:"Ctrl+C는 현재 실행 중인 프로세스를 중지(SIGINT)하는 단축키입니다. 로그아웃은 logout, exit, Ctrl+D로 가능합니다."},
{tag:"명령어",q:"현재 작업 중인 디렉터리의 절대 경로를 출력하는 명령어는?",opts:["which","whereis","pwd","cd"],ans:2,ex:"pwd(print working directory)는 현재 작업 디렉터리의 절대 경로를 출력합니다."},
{tag:"명령어",q:"man 명령 실행과 가장 관계 깊은 명령어는?",opts:["cat","more","less","which"],ans:2,ex:"man과 less는 둘 다 페이지 단위로 내용을 확인하고 이전 페이지로도 돌아갈 수 있습니다."},
{tag:"명령어",q:"하나의 파일을 여러 작은 파일로 분리하며 옵션 없이 실행하면 1000줄 단위로 분리하는 명령어는?",opts:["cut","sort","split","wc"],ans:2,ex:"split은 기본적으로 1000줄 단위로 파일을 분리합니다. 분리된 파일 뒤에 영문 2자리(aa, ab...)가 추가됩니다."},
{tag:"리다이렉션",q:"오류 메시지를 파일로 저장하는 리다이렉션 명령으로 알맞은 것은?",opts:["cat nofile 0> error_log","cat nofile 1> error_log","cat nofile 2> error_log","cat nofile > error_log"],ans:2,ex:"리다이렉션에서 0=표준입력, 1=표준출력, 2=표준에러입니다. 오류 저장에는 2>를 사용합니다."},
{tag:"부팅",q:"부트 매니저(GRUB)가 설치되는 영역으로 알맞은 것은?",opts:["MBR","Primary Partition","Extend Partition","Logical Partition"],ans:0,ex:"부트로더는 디스크에서 제일 먼저 읽히는 MBR(Master Boot Record, 512바이트)에 설치됩니다."},
{tag:"장치",q:"CD-ROM이 IDE Secondary Slave로 연결 시 장치 파일 이름은?",opts:["/dev/h4d","/dev/hdd","/dev/hdd1","/dev/hd4"],ans:1,ex:"Primary Master=hda, Primary Slave=hdb, Secondary Master=hdc, Secondary Slave=hdd입니다."},
{tag:"네트워크",q:"특정 도메인의 IP 주소를 조회하는 명령으로 틀린 것은?",opts:["nslookup","host","hostname","dig"],ans:2,ex:"hostname은 시스템 자신의 호스트명을 출력합니다. IP 조회는 nslookup, host, dig로 합니다."},
{tag:"명령어",q:"10분 후 시스템을 종료하는 명령으로 알맞은 것은?",opts:["shutdown -h +10","shutdown -h 10m","shutdown -h +10m","shutdown -h 10minute"],ans:0,ex:"shutdown -h +10이 10분 후 종료입니다. +m 형식으로 분 단위 예약이 가능합니다."},
{tag:"배포판",q:"상용판(유료) 리눅스로 알맞은 것은?",opts:["CentOS","Scientific Linux","RHEL","Fedora"],ans:2,ex:"RHEL(Red Hat Enterprise Linux)은 유료 라이선스로 판매되며 레드햇의 기술 지원을 받습니다."},
{tag:"명령어",q:"현재 접속된 모든 사용자에게 메시지를 보낼 때 사용하는 명령어는?",opts:["echo","message","talk","wall"],ans:3,ex:"wall은 시스템에 로그인한 모든 사용자에게 메시지를 보내는 명령어입니다."},
{tag:"배포판",q:"슬랙웨어 계열 리눅스에 속하는 배포판으로 틀린 것은?",opts:["Salix OS","Vector Linux","SUSE","Knoppix"],ans:2,ex:"SUSE는 RPM 패키지 형식을 사용하는 Red Hat 계열이 아닌, 데비안 계열(Debian/Ubuntu)과 함께 양대 산맥을 이루는 독자적인 계열의 상용 리눅스입니다."},
{tag:"보안",q:"Shadow Password에 대한 설명으로 맞는 것은?",opts:["패스워드를 한번 더 암호화하여 보안을 강화","UNIX 네트워크에서 사용하는 네트워크 인증","방화벽을 이용한 보안 강화","웹사이트 패스워드 자동 입력 기능"],ans:0,ex:"/etc/passwd의 패스워드 필드를 x로 표시하고 실제 암호화된 패스워드는 /etc/shadow에 별도 저장합니다."},
{tag:"명령어",q:"각 명령어 설명으로 틀린 것은?",opts:["head: 파일의 처음 부분을 보여준다","tail: 파일의 마지막 부분을 보여준다","uniq: 파일 내용을 줄 단위로 정렬한다","file: 파일의 종류를 알 때 사용한다"],ans:2,ex:"uniq는 중복된 행을 하나로 만드는 명령어입니다. 정렬은 sort를 사용합니다."},
{tag:"보안",q:"Shadow Password 사용 시 /etc/passwd에 포함된 내용으로 틀린 것은?",opts:["uid","gid","패스워드","로그인 셸"],ans:2,ex:"/etc/shadow를 사용하면 패스워드 부분만 따로 /etc/shadow에 암호화 저장됩니다. /etc/passwd에는 표시되지 않습니다."},
{tag:"디렉터리",q:"숨김 디렉터리 '.fileA'를 mkdir로 생성했을 때 올바른 설명은?",opts:["디렉터리가 생성되지 않고 파일이 생성된다","cd 명령으로 이동할 수 없다","ls -a 옵션으로 찾을 수 있다",".fileA 내에는 특수 파일만 저장 가능하다"],ans:2,ex:"점(.)으로 시작하는 파일/디렉터리는 숨김 파일로 ls -a 옵션으로 확인할 수 있습니다."},
{tag:"명령어",q:"userdel -r 옵션의 기능으로 알맞은 것은?",opts:["계정만 삭제","계정과 홈 디렉터리까지 삭제","계정을 강제로 삭제","기본 홈 디렉터리 정보 확인"],ans:1,ex:"userdel -r은 계정과 해당 홈 디렉터리 및 하위 내용까지 모두 삭제합니다."},
{tag:"라이선스",q:"MIT 라이선스에 대한 설명으로 올바른 것은?",opts:["파생 프로그램도 반드시 동일 라이선스여야 한다","소스 코드 수정 시 반드시 공개해야 한다","수정 후 제품 출시 시 오픈소스 공개 의무가 없다","소스코드와 실행파일 라이선스를 분리 관리한다"],ans:2,ex:"MIT 라이선스는 제한이 느슨해 수정 후 상용 제품을 만들어도 오픈소스 공개 의무가 없습니다."},
{tag:"파일시스템",q:"일부 디스크 오류 시에도 정상 운영이 가능하게 하는 파일시스템 유형은?",opts:["ext4","vfat","software RAID","Physical volume(LVM)"],ans:2,ex:"software RAID(특히 RAID 1 미러링, RAID 5)는 일부 디스크 오류에도 데이터 손실 없이 운영됩니다."},
{tag:"환경변수",q:"which 명령과 가장 관계 깊은 환경변수는?",opts:["TERM","PS1","PATH","DISPLAY"],ans:2,ex:"which는 명령어의 실행 파일 위치를 찾는 명령어로 PATH 환경변수에 설정된 경로에서 탐색합니다."},
{tag:"명령어",q:"접속 중인 사용자 ID를 간단히 나열하는 명령어는?",opts:["who","w","id","users"],ans:3,ex:"users는 시스템에 접속해 있는 사용자의 ID를 나열합니다. who와 w는 더 상세한 정보를 보여줍니다."},
{tag:"네트워크",q:"리눅스에서 패킷이 특정 호스트까지 전달되는 과정을 출력하는 명령어는?",opts:["route","tracert","traceroute","host"],ans:2,ex:"윈도우에서는 tracert, 리눅스에서는 traceroute를 사용하여 목적지까지의 경로를 추적합니다."},
{tag:"역사",q:"GNU 프로젝트와 관련이 없는 것은?",opts:["FSF(Free Software Foundation)","Richard Stallman","Linux","Windows 2000"],ans:3,ex:"Windows 2000은 마이크로소프트 제품입니다. GNU 프로젝트는 FSF, 리처드 스톨만, 리눅스 커널과 관련있습니다."},
{tag:"보안",q:"/etc/passwd 파일 내용 'lms:x:1000:1000::/home/lms:/bin/false'에서 틀린 설명은?",opts:["lms 계정의 패스워드는 x로 암호화되어 /etc/passwd에 저장","lms 계정의 uid와 gid는 각각 1000","lms 계정의 홈 디렉터리는 /home/lms","lms 계정은 이 시스템에 로그인할 수 없다"],ans:0,ex:"x는 패스워드가 /etc/shadow에 별도 암호화 저장된다는 의미입니다. /etc/passwd에는 저장되지 않습니다."},
{tag:"명령어",q:"파일 비교와 관련이 없는 명령어는?",opts:["gcc","cmp","comm","diff"],ans:0,ex:"gcc는 컴파일러입니다. cmp, comm, diff는 모두 파일 비교 명령어입니다."},
{tag:"네트워크",q:"ICMP echo request/reply를 이용해 원격 호스트의 동작 여부를 확인하는 명령은?",opts:["login","route","ping","nslookup"],ans:2,ex:"ping은 ICMP 프로토콜을 이용해 원격 호스트가 살아있는지 확인하는 네트워크 진단 명령어입니다."},
{tag:"네트워크",q:"traceroute 명령과 가장 관련 깊은 프로토콜은?",opts:["TCP","UDP","ARP","ICMP"],ans:3,ex:"ICMP(Internet Control Message Protocol)는 ping, traceroute 등에서 사용됩니다."},
{tag:"명령어",q:"#cal 명령을 옵션 없이 실행했을 때 결과는?",opts:["올해의 달력이 전부 출력된다","오늘 날짜가 속한 달의 달력이 출력된다","연도,월,일,시간 순으로 출력된다","시간,일,월,연도 순으로 출력된다"],ans:1,ex:"cal 명령어는 옵션 없이 실행하면 현재 달의 달력을 출력합니다."},
{tag:"명령어",q:"달력 정보를 출력하는 명령으로 알맞은 것은?",opts:["date","cal","hwclock","time"],ans:1,ex:"cal은 달력을 출력합니다. hwclock은 하드웨어 시간, time은 프로그램 실행시간을 확인합니다."},
{tag:"명령어",q:"find -name '*.txt' (  ) rm {} \\; 에서 괄호 안에 들어갈 옵션은?",opts:["-pruneclear","-run","-comm","-exec"],ans:3,ex:"-exec는 find로 검색된 파일에 명령어를 실행합니다. -ok는 사용자 확인을 받고 실행합니다."},
{tag:"배포판",q:"RHEL 소스 코드를 그대로 빌드한 무료 복제판(Clone)으로 알맞은 것은?",opts:["Fedora","Ubuntu","CentOS","Linux Mint"],ans:2,ex:"CentOS(Community Enterprise OS)는 RHEL의 소스를 빌드한 무료 배포판입니다."},

{tag:"리다이렉션",q:"'ls -al >more' 명령의 실행 결과는?",opts:["현재 디렉토리의 파일 목록을 한 페이지씩 나누어 출력한다","현재 디렉토리의 파일 목록을 more라는 파일에 저장한다","현재 디렉토리의 파일 목록을 모니터에 출력하고 more 파일에도 저장한다","more 파일의 정보를 조회한다"],ans:1,ex:"리다이렉션 >를 사용하면 출력이 화면에 나오지 않고 바로 파일에 저장됩니다. more는 여기서 파일명입니다."},
{tag:"명령어",q:"rm -r [디렉터리] 명령 사용 시 결과는?",opts:["사용자의 확인에 의하여 파일과 디렉터리를 지운다","디렉터리 내의 파일과 하위 디렉터리까지 모두 삭제한다","안전하게 파일과 디렉터리를 지울 수 있는 명령어이다","디렉터리 내의 각각의 파일을 지우는 정보를 자세히 보여준다"],ans:1,ex:"rm -r은 사용자 확인 없이 바로 디렉터리와 그 안의 모든 파일/하위 디렉터리를 삭제합니다."},
{tag:"네트워크",q:"nslookup으로 메일 서버 정보를 조회할 때 사용하는 옵션은? #nslookup ( ) ihd.or.kr",opts:["mx","type=mx","-mx","-type=mx"],ans:3,ex:"nslookup에서 MX 레코드 조회는 -type=mx 또는 -q=mx 옵션을 사용합니다."},

{tag:"명령어",q:"cd /usr/local/src 위치에서 'cd ..'를 실행했을 때 이동되는 디렉터리는?",opts:["/","/usr/local","/usr/local/src","/home/kaituser"],ans:1,ex:"..은 상위 디렉터리를 의미합니다. /usr/local/src의 상위 디렉터리는 /usr/local입니다."},

{tag:"명령어",q:"시스템의 하드웨어 시간을 출력하는 명령어가 아닌 것은?",opts:["hwclock","clock","date","rdate"],ans:2,ex:"hwclock과 clock은 하드웨어 시간을 출력합니다. date는 소프트웨어 시간, rdate는 원격 타임서버와 동기화합니다."},

{tag:"명령어",q:"alias로 설정한 별명을 해제하는 명령은? (#alias 123='ls -alF' 해제 시)",opts:["alias","unalias","which","whatis"],ans:1,ex:"unalias [별명]으로 설정한 별명을 해제합니다. unalias 123을 하면 123으로 설정된 별명이 해제됩니다."},
{tag:"명령어",q:"ihduser 사용자의 패스워드 사용을 일시적으로 막으려 할 때 알맞은 것은?",opts:["passwd -d ihduser","passwd -u ihduser","passwd -r ihduser","passwd -l ihduser"],ans:3,ex:"passwd -l(또는 usermod -L)은 패스워드를 잠금 처리하여 일시적으로 로그인을 막습니다. passwd -u는 잠금 해제입니다."},
{tag:"라이선스",q:"아파치(Apache) 라이선스를 적용하는 소프트웨어로 알맞은 것은?",opts:["CentOS","Hadoop","Firefox","OS X"],ans:1,ex:"Hadoop(Apache Hadoop)은 Apache 라이선스를 사용합니다. CentOS와 Firefox는 GPL, OS X는 애플 퍼블릭 소스 라이선스를 사용합니다."},
{tag:"라이선스",q:"'수정본의 재배포 시 소스 코드의 비공개가 가능하며 X window System, jQuery, Node.js 등에 적용된 라이선스는?",opts:["GPL","MPL","MIT","BSD"],ans:2,ex:"MIT 라이선스는 소스 공개 의무가 없어 제한이 느슨합니다. 대표 소프트웨어: Node.js, jQuery, X Window System 등."},
];

let mode='start',questions=[],current=0,score=0,answered=false,wrongList=[],filterTag='전체';
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const tags=['전체',...[...new Set(ALL_Q.map(q=>q.tag))]];
function startQuiz(count){
  let pool=filterTag==='전체'?ALL_Q:ALL_Q.filter(q=>q.tag===filterTag);
  questions=shuffle(pool).slice(0,Math.min(count,pool.length));
  current=0;score=0;answered=false;wrongList=[];mode='quiz';render();
}
function render(){if(mode==='start')renderStart();else if(mode==='quiz')renderQuiz();else renderResult();}
function renderStart(){
  const el=document.getElementById('main');
  const total=ALL_Q.length;
  el.innerHTML=`<div class="start-card"><h2>📌 카테고리 필터</h2><div class="filter-wrap" id="fw"></div><h2 style="margin-top:1rem">🎯 문제 수 선택 <span style="font-size:13px;color:#888;font-weight:400">(전체 ${total}문제)</span></h2><div class="mode-grid"><div class="mode-btn" onclick="startQuiz(20)"><div class="mode-title">20문제</div><div class="mode-desc">빠른 연습</div></div><div class="mode-btn" onclick="startQuiz(50)"><div class="mode-title">50문제</div><div class="mode-desc">중간 점검</div></div><div class="mode-btn" onclick="startQuiz(100)"><div class="mode-title">100문제</div><div class="mode-desc">실전 연습</div></div><div class="mode-btn" onclick="startQuiz(${total})"><div class="mode-title">전체 ${total}문제</div><div class="mode-desc">완전 정복</div></div></div></div>`;
  const fw=document.getElementById('fw');
  tags.forEach(t=>{
    const cnt=t==='전체'?ALL_Q.length:ALL_Q.filter(q=>q.tag===t).length;
    const b=document.createElement('button');
    b.className='filter-btn'+(t===filterTag?' active':'');
    b.textContent=`${t} (${cnt})`;
    b.onclick=()=>{filterTag=t;renderStart();};
    fw.appendChild(b);
  });
}
function renderQuiz(){
  const el=document.getElementById('main');
  if(current>=questions.length){mode='result';renderResult();return;}
  const q=questions[current];
  const pct=Math.round((current/questions.length)*100);
  el.innerHTML=`<div class="dashboard"><div class="stat"><div class="stat-val">${current+1}/${questions.length}</div><div class="stat-label">진행</div></div><div class="stat"><div class="stat-val" style="color:#1D9E75">${score}</div><div class="stat-label">정답</div></div><div class="stat"><div class="stat-val" style="color:#e24b4a">${current-score}</div><div class="stat-label">오답</div></div><div class="stat"><div class="stat-val">${current>0?Math.round(score/current*100):0}%</div><div class="stat-label">정답률</div></div></div><div class="prog-wrap"><div class="prog-meta"><span>진행률 ${pct}%</span><span>${questions.length-current}문제 남음</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div></div><div class="q-card"><span class="q-tag">${q.tag}</span><div class="q-num">문제 ${current+1}</div><div class="q-text">${q.q}</div></div><div class="opts" id="opts"></div><div class="explain" id="explain">${q.ex}</div><div class="btn-row"><button class="btn" onclick="goStart()">처음으로</button><button class="btn primary" id="nb" style="display:none" onclick="nextQ()">다음 문제 →</button></div>`;
  answered=false;
  const opts=document.getElementById('opts');
  const shuffledOpts = shuffle(q.opts.map((o, i) => ({text: o, origIdx: i})));

  shuffledOpts.forEach((opt, i) => {
  const b = document.createElement('button');
  b.className = 'opt';
  b.dataset.origIdx = opt.origIdx;
  b.innerHTML = `<span style="font-weight:600;margin-right:8px">${['①','②','③','④'][i]}</span>${opt.text}`;
  b.onclick = () => choose(opt.origIdx, b); 
  opts.appendChild(b);
  });
}
function choose(origIdx, btn){
  if(answered)return;answered=true;
  const q=questions[current];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.origIdx == q.ans) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  if(origIdx===q.ans)score++;else wrongList.push({num:current+1,q:q.q,correct:q.opts[q.ans]});
  document.getElementById('explain').style.display='block';
  document.getElementById('nb').style.display='inline-block';
}
function nextQ(){current++;answered=false;renderQuiz();}
function goStart(){mode='start';render();}
function renderResult(){
  const el=document.getElementById('main');
  const pct=Math.round(score/questions.length*100);
  let comment='';
  if(pct>=90)comment='🎉 완벽합니다! 2급 1차 실력이 충분합니다.';
  else if(pct>=80)comment='👍 매우 우수합니다! 합격 가능성이 높습니다.';
  else if(pct>=60)comment='✅ 합격 기준(60점)을 넘었습니다. 더 다듬어 보세요.';
  else if(pct>=50)comment='📚 조금 더 노력이 필요합니다. 오답을 복습해 보세요.';
  else comment='💪 기초부터 다시 정리해 보세요. 포기하지 마세요!';
  let wHtml='';
  if(wrongList.length>0){
    wHtml=`<div class="wrong-list"><h3>❌ 틀린 문제 (${wrongList.length}개)</h3>`;
    wrongList.slice(0,20).forEach(w=>{wHtml+=`<div class="wrong-item"><span style="color:#a32d2d;font-weight:600">문제${w.num}.</span> ${w.q}<br><span style="color:#1D9E75">▶ 정답: ${w.correct}</span></div>`;});
    if(wrongList.length>20)wHtml+=`<div class="wrong-item" style="color:#aaa">... 외 ${wrongList.length-20}개 더</div>`;
    wHtml+='</div>';
  }
  el.innerHTML=`<div class="result-card"><div class="result-ring"><div class="result-pct">${pct}점</div><div class="result-sub">${score}/${questions.length}</div></div><div class="result-comment">${comment}</div>${wHtml}<div class="btn-row" style="justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn" onclick="goStart()">메인으로</button><button class="btn primary" onclick="startQuiz(${questions.length})">다시 풀기</button></div></div>`;
}
render();
</script>
</body>
</html>
